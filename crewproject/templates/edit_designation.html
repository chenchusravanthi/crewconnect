<!DOCTYPE html>
<html>

<head>

    <title>Edit Designation</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #333;
        }

        .messages {
            color: red;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Edit Designation</h2>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Designation Name</label>

        <input
            type="text"
            name="name"
            value="{{ designation.name }}"
            required
        >

        <label>Description</label>

        <textarea
            name="description"
        >{{ designation.description }}</textarea>

        <button type="submit">
            Update Designation
        </button>

    </form>

    <a href="{% url 'designations' %}" class="back">
        Back to Designations
    </a>

</div>

</body>

</html>
