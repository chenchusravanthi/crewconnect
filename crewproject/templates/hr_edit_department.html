<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Department</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e293b;
        }

        .content {
            margin-left: 278px;
            padding: 35px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
            color: #172554;
        }

        .header p {
            margin-top: 8px;
            color: #64748b;
        }

        .form-card {
            background: white;
            max-width: 650px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-card h2 {
            color: #172554;
            font-size: 21px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .update-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 11px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #1d4ed8;
        }

        .back-btn {
            background: #64748b;
            color: white;
            padding: 11px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #475569;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            color: #15803d;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        @media(max-width: 700px) {

            .content {
                margin-left: 0;
                padding: 15px;
            }

            .form-card {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="content">


    <!-- Header -->

    <div class="header">

        <h1>
            Edit Department
        </h1>

        <p>
            Update department information
        </p>

    </div>


    <!-- Form Card -->

    <div class="form-card">


        <h2>
            Department Information
        </h2>


        <!-- Messages -->

        {% if messages %}

            {% for message in messages %}

                <div class="{% if message.tags == 'success' %}success{% else %}error{% endif %}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <!-- Edit Form -->

        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="name">
                    Department Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ department.name }}"
                    placeholder="Enter department name"
                    required
                >

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="update-btn">

                    Update Department

                </button>


                <a
                    href="{% url 'department' %}"
                    class="back-btn">

                    Back to Departments

                </a>

            </div>


        </form>


    </div>


</div>


</body>

</html>
