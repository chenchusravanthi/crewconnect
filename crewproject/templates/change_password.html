<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .password-container {
            width: 450px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #0056b3;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            text-decoration: none;
            color: #555;
        }

        .back-btn:hover {
            color: #007bff;
        }

        .messages {
            margin-bottom: 15px;
        }

        .message {
            padding: 10px;
            border-radius: 5px;
            background: #f8d7da;
            color: #842029;
            margin-bottom: 8px;
        }

    </style>

</head>

<body>

<div class="password-container">

    <h2>Change Password</h2>


    <!-- Messages -->

    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}


    <!-- Change Password Form -->

    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label for="old_password">
                Current Password
            </label>

            <input
                type="password"
                id="old_password"
                name="old_password"
                placeholder="Enter current password"
                required
            >

        </div>


        <div class="form-group">

            <label for="new_password">
                New Password
            </label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter new password"
                required
            >

        </div>


        <div class="form-group">

            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                required
            >

        </div>


        <button type="submit" class="btn">
            Change Password
        </button>

    </form>


    <a href="{% url 'settings' %}" class="back-btn">
        ← Back to Settings
    </a>

</div>

</body>

</html>op[
